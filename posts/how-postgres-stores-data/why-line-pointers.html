<body>
<div class="card">
<svg viewBox="0 0 800 720" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Why postgres pages use line pointers</title>
  <desc id="desc">Without line pointers, rows are packed from the start of the page and the index stores row 4 as byte 144. Deleting row 3 and closing the gap moves row 4 to byte 104, so the index must be rewritten too. With line pointers, the index stores (page 0, line pointer 4). Compacting the page only changes line pointer 4's offset and the index is untouched.</desc>
  <defs>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a9eed"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
  </defs>

  <text id="mode" class="h t" x="24" y="48" font-size="32"></text>
  <text id="cap" class="h m" x="24" y="90" font-size="26"></text>

  <!-- index -->
  <rect x="16" y="300" width="214" height="134" rx="12" fill="var(--bluefill)" stroke="var(--blue)" stroke-width="2"/>
  <text class="h t" x="123" y="334" font-size="24" text-anchor="middle">index</text>
  <rect id="idxBox" x="32" y="348" width="182" height="72" rx="8" fill="var(--bg)" stroke="var(--blue)" stroke-width="1.5"/>
  <text class="h t" x="123" y="376" font-size="22" text-anchor="middle">row 4 →</text>
  <text id="idxv" class="n t" x="123" y="404" font-size="18" text-anchor="middle"></text>

  <!-- page -->
  <rect x="290" y="140" width="490" height="560" rx="12" fill="var(--teal)" stroke="var(--cyan)" stroke-width="2"/>
  <rect x="306" y="156" width="458" height="44" rx="7" fill="var(--row)" stroke="var(--cyan)" stroke-width="1.5"/>
  <text class="h t" x="535" y="185" font-size="22" text-anchor="middle">page header</text>

  <g id="lpArrows"></g>

<script>
const NS='http://www.w3.org/2000/svg';
const el=(t,a,p,txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;if(p)p.appendChild(e);return e;};

/* geometry (viewBox units) */
const TX=306, TW=340, TH=54;
const botY=s=>628-64*s;               // with line pointers: slot 0 at the bottom of the page
const topY=s=>220+64*s;               // without line pointers: rows packed from the start
const LPY=212, LPH=52, LPW=104, lpX=k=>306+k*112;
// every row is 40 bytes after alignment
const botOff=s=>8152-40*s, topOff=s=>24+40*s;
const names=["row 1 · Bob","row 2 · Alice","row 3 · Carol","row 4 · Dave"];

const T=names.map((n,k)=>{
  const g=el('g',{class:'mv'},document.getElementById('tups'));
  const box=el('rect',{x:TX,y:0,width:TW,height:TH,rx:7,'stroke-width':1.8},g);
  el('text',{x:TX+16,y:36,'font-size':24,class:'h t'},g,n);
  const o=el('text',{x:TX+TW-14,y:34,'font-size':16,'text-anchor':'end',class:'n m'},g,'');
  return {g,box,o};
});
const LP=names.map((n,k)=>{
  const g=el('g',{},document.getElementById('lps')), x=lpX(k);
  const box=el('rect',{x,y:LPY,width:LPW,height:LPH,rx:7,'stroke-width':1.8},g);
  el('text',{x:x+10,y:LPY+33,'font-size':22,class:'h t'},g,`lp ${k+1}`);
  const o=el('text',{x:x+LPW-8,y:LPY+32,'font-size':15,'text-anchor':'end',class:'n m'},g,'');
  return {box,o};
});
const LA=names.map((n,k)=>el('path',{fill:'none',stroke:'#f59e0b','stroke-width':k===3?2.6:1.6,'marker-end':'url(#m-amber)',class:'fd'},document.getElementById('lpArrows')));

/* steps: row4 = slot of row 4; idx = what the index stores; st = state of the index pointer */
const S=[
 {lp:0, mode:'Without line pointers', cap:'The index stores a byte offset', r3:'live', row4:3, idx:'byte 144', st:'ok'},
 {lp:0, mode:'Without line pointers', cap:'DELETE row 3 leaves a hole', r3:'dead', row4:3, idx:'byte 144', st:'ok'},
 {lp:0, mode:'Without line pointers', cap:'Closing the gap moves row 4. The index is now stale', r3:'gone', row4:2, idx:'byte 144', st:'stale'},
 {lp:0, mode:'Without line pointers', cap:'So the index has to be rewritten too', r3:'gone', row4:2, idx:'byte 104', st:'updated'},
 {lp:1, mode:'With line pointers', cap:'The index stores (page, line pointer)', r3:'live', row4:3, idx:'(0, 4)', st:'ok'},
 {lp:1, mode:'With line pointers', cap:'DELETE row 3 leaves a hole', r3:'dead', row4:3, idx:'(0, 4)', st:'ok'},
 {lp:1, mode:'With line pointers', cap:'Compacting moves row 4. Only lp 4 changes', r3:'gone', row4:2, idx:'(0, 4)', st:'kept'},
];
const holds=[3600,2800,3800,3800,3400,2800,5400];
const COL={ok:'blue',stale:'red',updated:'amber',kept:'green'};
const HEX={blue:'#4a9eed',red:'#ef4444',amber:'#f59e0b',green:'#22c55e'};

function render(i){
  const s=S[i], lp=!!s.lp;
  document.getElementById('mode').textContent=s.mode;
  document.getElementById('cap').textContent=s.cap;
  document.getElementById('lps').setAttribute('opacity',lp?1:0);
  const slot=[0,1,2,s.row4];
  for(let k=0;k<4;k++){
    const t=T[k], sl=slot[k], y=lp?botY(sl):topY(sl);
    const dead=(k===2&&s.r3==='dead'), gone=(k===2&&s.r3==='gone');
    t.g.style.transform=`translateY(${y}px)`;
    t.g.setAttribute('opacity',gone?0:(dead?.5:1));
    t.box.setAttribute('fill',dead?'var(--mutedrow)':(k===3?'var(--amberfill)':'var(--row)'));
    t.box.setAttribute('stroke',dead?'var(--mutedstroke)':(k===3?'var(--amber)':'var(--cyan)'));
    t.box.setAttribute('stroke-dasharray',dead?'7 6':'');
    t.o.textContent=dead?'':(lp?botOff(sl):topOff(sl));
    // line pointers
    const unused=(k===2&&gone);
    LP[k].box.setAttribute('fill',unused?'var(--mutedrow)':'var(--amberfill)');
    LP[k].box.setAttribute('stroke',unused?'var(--mutedstroke)':'var(--amber)');
    LP[k].o.textContent=unused?'unused':botOff(sl);
    LP[k].o.setAttribute('font-size',unused?12:15);
    LP[k].o.setAttribute('fill',(k===3&&s.st==='kept')?'var(--amber)':'var(--muted)');
    const cx=lpX(k)+LPW/2, ty=botY(sl)+TH/2;
    LA[k].setAttribute('d',`M${cx} ${LPY+LPH} C ${cx} ${LPY+LPH+70}, ${TX+TW+80} ${ty}, ${TX+TW+6} ${ty}`);
    LA[k].setAttribute('opacity',(!lp||gone||dead)?0:(k===3?1:.35));
  }
  // index pointer
  const A=document.getElementById('idxArrow');
  if(!lp){ const ty=topY(s.idx==='byte 144'?3:2)+TH/2; A.setAttribute('d',`M230 384 H 262 V ${ty} H ${TX-4}`); }
  else   { A.setAttribute('d',`M230 372 H 260 V 120 H ${lpX(3)+LPW/2} V ${LPY-4}`); }
  const c=COL[s.st]; A.setAttribute('stroke',HEX[c]); A.setAttribute('marker-end',`url(#m-${c})`);
  const iv=document.getElementById('idxv'); iv.textContent=s.idx;
  iv.setAttribute('fill',s.st==='stale'?HEX.red:(s.st==='updated'?HEX.amber:'#f5f5f5'));
  document.getElementById('idxBox').setAttribute('stroke',s.st==='updated'?HEX.amber:HEX.blue);
}

/* player */
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let i=0, playing=!reduced, timer=null, visible=true;
const playBtn=document.querySelector('#play text');
function show(){render(i); playBtn.textContent=playing?'❚❚':'▶';}
function tick(){clearTimeout(timer); if(playing&&visible) timer=setTimeout(()=>{i=(i+1)%S.length;show();tick();},holds[i]);}
const act={next:()=>{i=(i+1)%S.length;show();tick();}, prev:()=>{i=(i-1+S.length)%S.length;show();tick();}, play:()=>{playing=!playing;show();tick();}};
for(const id in act){const b=document.getElementById(id); b.addEventListener('click',act[id]); b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act[id]();}});}
if('IntersectionObserver' in window){new IntersectionObserver(es=>{visible=es[0].isIntersecting;tick();}).observe(document.querySelector('.card'));}
document.fonts.ready.then(()=>{show();tick();});
show();
</script>
</body>
</html>
